/**:
  ros__parameters:
    panda:
      chain_start: "fer_link0" # base frame of commands
      chain_end: "fer_link8" # flange frame (fer_hand_tcp does not exist without the hand)

      publisher: "Velocity" # "Position" or "Velocity" or "Trajectory" or "TrajectoryAction"
      topic_namespace: "joint_velocity_controller" # velocity_controllers/JointGroupVelocityController in franka_gazebo_controllers.yaml

      initIKAngle: [0.0, -0.785, 0.0, -2.356, 0.0, 1.571, 0.785] # size of this should be equal to DoF

      # initial_pose_frame: test # default frame is same as chain_start
      # Flange pose equivalent to the fer_sim hand TCP pose [0.4, 0.0, 0.4, pi, 0, 0]
      initial_pose: [0.4, 0.0, 0.4, 3.141592, 0.0, 0.0] # [x, y, z, roll, pitch, yaw]
